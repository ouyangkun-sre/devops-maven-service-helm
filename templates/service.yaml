apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.service.service_name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.service.service_label }}
spec:
  type: {{ .Values.service.service_type }}
  selector:
    app: {{ .Release.Name }}-{{ .Values.deployment.pod_label }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetport }}
      {{- if eq .Values.service.service_type "NodePort" }}
      nodePort: {{ .Values.service.nodeport }}
      {{- end }}
