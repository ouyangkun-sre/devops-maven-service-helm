# Jenkins 部署用的 RBAC，手工 kubectl apply -f deploy/rbac.yaml
# 不要放进 templates/：否则它变成被 helm 自己管理的资源，而部署它的正是这个 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: devops
rules:
  # Helm 3 把 release 历史存成 devops 下的 sh.helm.release.v1.<release>.v<N> Secret。
  # 权限不足时 helm upgrade 在“查询 release 是否存在”这一步就失败：
  #   query: failed to query with labels: secrets is forbidden
  # 七个动作各有用途：list/get 读历史，create 首装，update 写新版本，
  # patch/delete 给 --atomic 失败回滚和 helm uninstall 清理，watch 供 --wait 观察。
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # chart 里的负载资源；--atomic 内含 --wait，需要读 pods/replicasets 才能判断滚动更新是否完成
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: devops
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: devops
roleRef:
  kind: Role
  name: jenkins-deployer
  apiGroup: rbac.authorization.k8s.io
