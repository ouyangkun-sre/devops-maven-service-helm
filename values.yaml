deployment:
 # 资源名与标签渲染为 <release 名>-<这里的名字>，所以只写角色名，别再重复应用名
 deployment_name: app
 nodeName: k8s-master
 replicas: 2
 pod_label: app
 imagePullSecret: harbor-secret
 image: registry.cn-beijing.aliyuncs.com/yangyang/pod-test
 imageTag: v0.1
 imagePullPolicy: IfNotPresent
 container_name: devops-maven-service-container
 requests:
   cpu: 100m
   memory: 256Mi
 limits:
   cpu: 500m
   memory: 768Mi

service:
 service_name: svc
 service_label: svc
 service_type: NodePort
 port: 8080
 containerport: 8080
 targetport: 8080
 nodeport: 30080

ingress:
  ingress_name: ingress
  enabled: true
  ingress_label: ingress
  ingressClassName: cilium
  host: demo.devops.local
